<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080808" />
<title>Offline — MovieSphere</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#080808; color:#fff; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; text-align:center; }
  svg { width: 72px; height: 72px; margin-bottom: 20px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color:#B3B3B3; line-height:1.6; margin: 0 0 24px; }
  a, button { display:inline-block; background:#E50914; color:#fff; border:0; border-radius:999px; padding:12px 22px; font-weight:600; font-size:15px; text-decoration:none; cursor:pointer; margin: 4px; }
  a.secondary { background:#181818; border:1px solid #292929; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 512 512" aria-hidden="true"><circle cx="256" cy="256" r="168" fill="none" stroke="#E50914" stroke-width="34"/><path d="M214 176 L352 256 L214 336 Z" fill="#fff"/></svg>
  <h1>You’re offline</h1>
  <p>This page isn’t available without a connection. Your saved list and any films stored for offline viewing are still available in the app.</p>
  <button onclick="location.reload()">Try again</button>
  <a class="secondary" href="/downloads">Offline downloads</a>
</main>
</body>
</html>
